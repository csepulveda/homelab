loki:
  test:
    enabled: false
  lokiCanary:
    enabled: false
  monitoring:
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
  global:
    extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-rustfs
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-rustfs
          key: AWS_SECRET_ACCESS_KEY
  loki:
    image:
      tag: 3.5.1
    storage:
      type: s3
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      s3:
        endpoint: "http://192.168.100.155:30292"
        region: "us-east-1"
        s3ForcePathStyle: true
        insecure: true
    schemaConfig:
      configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
    auth_enabled: false
    commonConfig:
      replication_factor: 2
    # Retención: sin esto Loki nunca borra nada del bucket (al 2026-11-01 había
    # 383k objetos / 16 GB en rustfs, 278k con más de 90 días). El compactor corre
    # en el target backend y aplica retention_period de limits_config.
    compactor:
      retention_enabled: true
      delete_request_store: s3
      compaction_interval: 10m
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
    limits_config:
      retention_period: 60d
    # Menos objetos y menos LIST contra rustfs: chunks más grandes y resync del
    # índice cada 15 min en vez de 5 (valores por defecto: 30m / 2h / 5m).
    ingester:
      chunk_idle_period: 1h
      max_chunk_age: 4h
    storage_config:
      tsdb_shipper:
        resync_interval: 15m
  minio:
    enabled: false
  read:
    replicas: 2
    extraArgs:
    - -log.level=error
  write:
    replicas: 2
    persistence:
      storageClass: iscsi
    extraArgs:
    - -log.level=error
  backend:
    replicas: 2
    persistence:
      storageClass: iscsi
    extraArgs:
    - -log.level=error
  gateway:
    replicas: 2
    extraArgs:
    - -log.level=error
