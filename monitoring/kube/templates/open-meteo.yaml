# Deployment/Service/ServiceMonitors del json_exporter compartido; la config vive en open-meteo-exporter-cm.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-meteo-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: open-meteo-exporter}
  template:
    metadata:
      labels: {app: open-meteo-exporter}
      annotations:
        # reinicia el pod cuando cambia la config (json_exporter no la recarga en caliente)
        checksum/config: {{ include (print $.Template.BasePath "/open-meteo-exporter-cm.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.8.0
          args:
            - --config.file=/config/config.yml
          ports:
            - name: http-metrics
              containerPort: 7979
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: http-metrics}
            periodSeconds: 10
          volumeMounts:
            - name: cfg
              mountPath: /config
              readOnly: true
      volumes:
        - name: cfg
          configMap:
            name: open-meteo-exporter-cm
---
apiVersion: v1
kind: Service
metadata:
  name: open-meteo-exporter
  namespace: monitoring
  labels:
    app: open-meteo-exporter
spec:
  selector: {app: open-meteo-exporter}
  ports:
    - name: http-metrics
      port: 7979
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: open-meteo-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: open-meteo-exporter}
  namespaceSelector:
    matchNames: ["monitoring"]
  endpoints:
    - port: http-metrics
      path: /probe
      interval: 5m
      scrapeTimeout: 30s
      params:
        module: ["default"]
        target: ["https://api.open-meteo.com/v1/forecast?latitude=-33.3833&longitude=-70.5667&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=America/Santiago"]
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: "open-meteo-vitacura"
      metricRelabelings:
        - action: replace
          targetLabel: job
          replacement: "open-meteo"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: open-meteo-exporter}
  namespaceSelector:
    matchNames: ["monitoring"]
  endpoints:
    - port: http-metrics
      path: /probe
      interval: 30s
      scrapeTimeout: 10s
      params:
        module: ["ollama"]
        target: ["http://192.168.100.149:11434/api/ps"]
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: "192.168.100.149:11434"
      metricRelabelings:
        - action: replace
          targetLabel: job
          replacement: "ollama"
