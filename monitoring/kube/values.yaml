kube:
  # k3s no expone controller-manager, scheduler ni kube-proxy (este ultimo esta
  # deshabilitado: lo reemplaza Cilium). Sin esto el chart genera targets
  # inexistentes y las alertas *Down quedan siempre encendidas.
  kubeProxy:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  # etcd embebido de k3s, expuesto con `etcd-expose-metrics: true` en
  # /etc/rancher/k3s/config.yaml (http :2381 en la IP del nodo).
  # ArgoCD excluye los objetos Endpoints de su gestion (resource.exclusions por
  # defecto), asi que el Endpoints que genera el chart para kubeEtcd.endpoints
  # nunca se aplica y el target queda vacio. Se mantienen reglas y dashboards
  # de etcd (kubeEtcd.enabled) pero el scrape va por static_configs abajo.
  kubeEtcd:
    enabled: true
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: "null"
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # Latido: se enviara a un dead-man's switch externo cuando exista canal.
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          # Enchufe ESPHome apagado a proposito; se conserva la config.
          - receiver: "null"
            matchers:
              - alertname = "TargetDown"
              - job = "esphome"
          # El NAS usa toda la RAM libre como ARC de ZFS: no es un problema.
          - receiver: "null"
            matchers:
              - alertname = "NodeMemoryHighUtilization"
              - instance = "192.168.100.155:9100"
      inhibit_rules:
        - source_matchers: [severity = "critical"]
          target_matchers: [severity =~ "warning|info"]
          equal: [namespace, alertname]
        - source_matchers: [severity = "warning"]
          target_matchers: [severity = "info"]
          equal: [namespace, alertname]
        - source_matchers: [alertname = "InfoInhibitor"]
          target_matchers: [severity = "info"]
          equal: [namespace]
        - target_matchers: [alertname = "InfoInhibitor"]
      receivers:
        - name: "null"
      templates:
        - /etc/alertmanager/config/*.tmpl
  prometheus:
    prometheusSpec:
      additionalScrapeConfigs:
        - job_name: kube-etcd
          scheme: http
          metrics_path: /metrics
          static_configs:
            - targets:
                - 192.168.100.156:2381
                - 192.168.100.157:2381
                - 192.168.100.158:2381
          relabel_configs:
            - source_labels: [__address__]
              regex: '192\.168\.100\.156:.*'
              target_label: node
              replacement: node001
            - source_labels: [__address__]
              regex: '192\.168\.100\.157:.*'
              target_label: node
              replacement: node002
            - source_labels: [__address__]
              regex: '192\.168\.100\.158:.*'
              target_label: node
              replacement: node003
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 25Gi
            storageClassName: iscsi
      serviceMonitorSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
  grafana:
    admin:
      existingSecret: grafana-admin-secret
    additionalDataSources:
      - name: Loki
        access: proxy
        type: loki
        uid: loki
        url: http://loki-gateway/
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: router.csepulveda.net
      enabled: true
      hosts:
      - grafana.csepulveda.net
      ingressClassName: cilium
      tls:
      - hosts:
        - grafana.csepulveda.net
        secretName: grafana-csepulveda-tls
