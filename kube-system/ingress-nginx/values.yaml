ingress-nginx:
  controller:
    electionID: ingress-controller-leader
    ingressClass: nginx
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
      controllerValue: "k8s.io/ingress-nginx"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    service:
      # Conserva la IP real del cliente: con Cluster, si el nodo que anuncia la
      # IP del LB (L2) no es el que corre el pod, el trafico cruza por vxlan con
      # SNAT y nginx ve la IP del nodo (10.42.x.x), rompiendo las whitelists
      # (ej. openclaw). Con Local, Cilium solo anuncia la IP desde los nodos
      # que tienen el pod.
      externalTrafficPolicy: Local
    metrics:
      enabled: true
      serviceMonitor:
        additionalLabels:
          release: prometheus
        enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
