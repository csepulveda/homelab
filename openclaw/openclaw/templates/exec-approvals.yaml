# Politica de exec del agente (se aplica con `openclaw approvals set` en un initContainer).
# Sin esto OpenClaw usa security=full: shell libre dentro del pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-exec-approvals
  namespace: openclaw
data:
  exec-approvals.json: |
    {{- $allow := list }}
    {{- if .Values.gastos.enabled }}
    {{- $allow = append $allow (dict "pattern" "/opt/gastos/gastos" "argPattern" "^(responder .{1,300}|corregir [GTCgtc][0-9]{1,5} .{1,120}|pendientes)$") }}
    {{- end }}
    {{- $policy := dict "security" "allowlist" "ask" "off" "askFallback" "deny" "autoAllowSkills" false }}
    {{ dict "version" 1 "defaults" $policy "agents" (dict "main" (merge (dict "allowlist" $allow) $policy)) | toJson }}
