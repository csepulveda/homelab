# Politica de exec del agente (se aplica con `openclaw approvals set` en un initContainer).
# Sin esto OpenClaw usa security=full: shell libre dentro del pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-exec-approvals
  namespace: openclaw
data:
  exec-approvals.json: |
    {{- /* main: sin exec. gastos: solo el CLI. */}}
    {{- $policy := dict "security" "allowlist" "ask" "off" "askFallback" "deny" "autoAllowSkills" false }}
    {{- $agents := dict "main" (merge (dict "allowlist" list) (deepCopy $policy)) }}
    {{- if .Values.gastos.enabled }}
    {{- $gastos := list (dict "pattern" "/opt/gastos/gastos" "argPattern" "^responder .{1,300}$") }}
    {{- $_ := set $agents "gastos" (merge (dict "allowlist" $gastos) (deepCopy $policy)) }}
    {{- end }}
    {{ dict "version" 1 "defaults" $policy "agents" $agents | toJson }}
