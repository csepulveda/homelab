image:
  repository: ghcr.io/openclaw/openclaw
  tag: 2026.10.9-slim@sha256:1a2a3ce113e435039dbeac5ae261759bb4759908563d91c81059e896b38c5d98

storage:
  storageClassName: iscsi
  size: 10Gi

# Ollama corriendo en el Mac Studio (LaunchAgent com.csepulveda.ollama)
ollama:
  baseUrl: http://192.168.100.149:11434
  # Benchmark agentico (2026-10-31, 7 tareas x2, M1 Max 32GB):
  #   gemma4:26b 100/100, 455 tok/s prefill, 43 tok/s gen -> principal
  #   muse-glimmer:30b-mlx 100/100, 77 / 14 tok/s (~6x mas lento)
  #   qwen3.8:27b 92/100, 79 / 14 tok/s
  primaryModel: gemma4:26b
  models:
    - gemma4:26b
    - muse-glimmer:30b-mlx
    - qwen3.8:27b
  contextTokens: 32768

# Secret creado fuera de git:
#   kubectl -n openclaw create secret generic openclaw-secrets \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32)
existingSecret: openclaw-secrets

# Claves de openclaw.json que manda git. En cada arranque el initContainer
# sync-config las copia desde el ConfigMap al openclaw.json del PVC; el resto
# (canales/WhatsApp, plugins, dispositivos, meta) se conserva tal cual.
managedConfigPaths:
  - models.providers.ollama
  - agents.defaults.model
  - gateway.trustedProxies
  - gateway.controlUi.allowedOrigins
  - tools.exec
  - tools.fs
  - cron.enabled
  - agents.ownership
  - agents.entries
  - agents.defaults.systemAgent
  # sin resets globales de sesión (el grupo de gastos ya no pasa por el modelo: plugin gastos-bridge)
  - session.resetByType
  # plugin gastos-bridge: cargado desde la carpeta read-only de herramientas
  - plugins.load
  - plugins.entries.gastos-bridge

# Grupos de WhatsApp = contextos, cada uno con su agente. Claw SOLO admite estos grupos:
# sync-config reescribe channels.whatsapp.groups (allowlist estricta, sin "*") y los
# bindings en cada arranque; cualquier otro grupo se descarta antes de llegar al modelo.
# El ID (JID) de cada grupo va en el Secret (el repo es público). Sin grupos -> groupPolicy disabled.
whatsappGroups:
  - name: Control Gastos
    agent: gastos
    secretKey: WA_GROUP_GASTOS

# Registro de gastos BCI (Gmail -> Google Sheets) con gog + modelo local.
# Datos personales fuera de git, en el Secret existingSecret:
#   GOG_KEYRING_PASSWORD  clave del keyring de gog (token OAuth en el PVC, ~/.openclaw/gog)
#   BCI_PDF_PASSWORD      clave de los PDF de cartola
#   GASTOS_ACCOUNT        cuenta Gmail
#   GASTOS_SHEET_ID       ID de la planilla
#   GASTOS_OWN_NAMES      nombres propios separados por coma (traspasos a cuentas propias)
# Los crons se crean una vez con el CLI (quedan en el PVC); ver files/gastos/README.md.
gastos:
  enabled: true
  # pregunta por WhatsApp si la confianza del modelo es menor a esto (benchmark 2026-10-31)
  umbral: "0.9"
  aprendizajeDias: "14"
  backfillMin: "50000"
  gog:
    url: https://github.com/steipete/gogcli/releases/download/v0.47.1/gogcli_0.47.1_linux_amd64.tar.gz
    sha256: 279bc3a03c1919d774e268ef229949f45b753a0e21257f9fb315b05be7a40ea9
  pypdf:
    url: https://files.pythonhosted.org/packages/3f/4b/77e8ad4ac42c9d93600f40541a50e9feb3a61d2bbee2d76f659346072051/pypdf-6.21.4-py3-none-any.whl
    sha256: 33e4fb41ca352810eb4e9838aa0d82d6888a5f8bf682f43e99cce5faa666255c

ingress:
  host: openclaw.csepulveda.net
  allowedSourceRanges:
    - 192.168.100.0/24
  # CIDR de pods (cilium cluster-pool), desde donde llega ingress-nginx
  trustedProxies:
    - 10.42.0.0/16
