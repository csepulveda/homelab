democratic-csi:
  controller:
    driver:
      enabled: true
      image:
        registry: docker.io/democraticcsi/democratic-csi
        # Pinned: la build `next` de 2026-10 exige TrueNAS >= 26 y el driver
        # freenas-api-* deja de arrancar contra SCALE 25.04. v1.9.5 (2026-01)
        # es la misma build que corria antes como `next`.
        tag: v1.9.5
  node:
    driver:
      image:
        registry: docker.io/democraticcsi/democratic-csi
        tag: v1.9.5
  csiDriver:
    name: org.democratic-csi.iscsi
  driver:
    existingConfigSecret: freenas-driver-config
    config:
      driver: freenas-api-iscsi
  storageClasses:
  - allowVolumeExpansion: true
    defaultClass: false
    mountOptions: []
    name: iscsi
    parameters:
      detachedVolumesFromSnapshots: "false"
      fsType: ext4
    reclaimPolicy: Delete
    secrets:
      controller-expand-secret: null
      controller-publish-secret: null
      node-publish-secret: null
      node-stage-secret: null
      provisioner-secret: null
    volumeBindingMode: Immediate
  volumeSnapshotClasses:
  - name: iscsi
    parameters:
      detachedSnapshots: "false"
