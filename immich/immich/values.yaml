immich:
  # Global env vars for all components (server + microservices)
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: host
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: dbname
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: password
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-pg-app
                  key: username
            IMMICH_TELEMETRY_INCLUDE: all
            IMMICH_API_METRICS_PORT: "8081"
            IMMICH_MICROSERVICES_METRICS_PORT: "8082"
            IMMICH_METRICS: "true"

  server:
    controllers:
      main:
        replicas: 2
        containers:
          main:
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.kubernetes.io/target: router.csepulveda.net
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: immich.csepulveda.net
            paths:
              - path: "/"
        tls:
          - hosts:
            - immich.csepulveda.net
            secretName: immich.csepulveda.net-tls

  machine-learning:
    controllers:
      main:
        replicas: 1
        containers:
          main:
            env:
              TRANSFORMERS_CACHE: /cache
              MACHINE_LEARNING_HTTP_KEEPALIVE_TIMEOUT_S: "0"
              IMMICH_LOG_LEVEL: debug
              ORT_DISABLE_MIMALLOC: "1"
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
    persistence:
      cache:
        enabled: true
        size: 10Gi
        type: emptyDir
        accessMode: ReadWriteMany

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-backup

  valkey:
    enabled: true

# Respaldos de la DB (ver templates/postgres-backup.yaml)
pgBackup:
  objectStoreName: immich-pg-s3
  # RustFS (app de TrueNAS), mismo S3 que usa Loki
  endpointURL: http://192.168.100.155:30292
  bucket: cnpg-immich
  # Secret creado fuera de git con AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  s3SecretName: immich-pg-s3
  # Ventana de recuperacion (PITR) de los backups diarios: d/w/m
  dailyRetention: 7d
  # 05:00 UTC = 02:00 Chile (verano) / 01:00 (invierno). 6 campos: seg min hora dia mes dow
  dailySchedule: "0 0 5 * * *"
  # Dump logico el dia 1 de cada mes a las 03:00 America/Santiago (5 campos)
  monthlySchedule: "0 3 1 * *"
  monthlyKeep: 12
